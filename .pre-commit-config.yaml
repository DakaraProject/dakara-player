---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: pytest-check
        name: unit tests
        entry: pytest --no-cov tests/unit
        language: system
        pass_filenames: false
      - id: isort-check
        name: check imports order
        entry: isort . --check
        language: system
        pass_filenames: false
      - id: black-check
        name: check code formatting
        entry: black . --check
        language: system
        pass_filenames: false
      - id: ruff-check
        name: check code quality
        entry: ruff check .
        language: system
        pass_filenames: false
      - id: yamllint-check
        name: check YAML files quality
        entry: yamllint .
        language: system
        pass_filenames: false
